# AUTO_SERVER cannot be combined with DB_CLOSE_ON_EXIT=FALSE (H2 rejects it at connect time)
spring.datasource.url=jdbc:h2:./data/omnissa-approval;DB_CLOSE_ON_EXIT=FALSE
spring.jpa.hibernate.ddl-auto=update
server.port=8081

# Honor X-Forwarded-Proto/Host/Port from the reverse proxy (Caddy or nginx).
# Without this, OAuth2 redirect URIs are generated as http:// behind a TLS-terminating
# proxy and the login flow fails. Safe when no proxy is present — the filter only
# acts when the headers exist.
server.forward-headers-strategy=framework

spring.web.resources.static-locations=file:./ext-web/,classpath:/static/

# ── Omnissa Access bootstrap (first-run auto-configuration) ──────────────────
# Set these via environment variables or application-local.properties (gitignored).
# The app will seed the database on first startup if these are present.
#
#   Environment variable form (recommended for Docker/production):
#     OMNISSA_BOOTSTRAP_URL=<tenant>.wss.workspaceone.com
#     OMNISSA_BOOTSTRAP_CLIENT_ID=<clientId>
#     OMNISSA_BOOTSTRAP_CLIENT_SECRET=<secret>
#
# Defaults are empty — setup wizard will prompt if not provided.
omnissa.bootstrap.url=
omnissa.bootstrap.client-id=
omnissa.bootstrap.client-secret=
omnissa.bootstrap.admin-username=
omnissa.bootstrap.admin-password=
omnissa.bootstrap.admin-email=
omnissa.admin-oauth.issuer-uri=
omnissa.admin-oauth.disable-consent=false

# ── Security options ─────────────────────────────────────────────────────────
# HTTP Basic auth on the inbound callout endpoint (POST /api/approvals/new).
# Omnissa Access sends these from its approvals settings — enter the same values
# there. OPTIONS probes stay unauthenticated so saving those settings still works.
# Env: OMNISSA_API_USERNAME / OMNISSA_API_PASSWORD.
#
# Required once omnissa.bootstrap.url names a tenant: the application refuses to
# start without either these or the acknowledgement below. Before a tenant is
# configured nothing is demanded, so a first run still needs no configuration at
# all. An injected request can only do harm once there is a tenant to act on.
omnissa.api.username=
omnissa.api.password=
# Set true to accept unauthenticated callouts on a tenant-configured install.
# Only appropriate when the endpoint genuinely cannot be reached from anywhere
# untrusted; the application logs a warning hourly while it is set.
# Env: OMNISSA_API_ALLOW_UNAUTHENTICATED.
omnissa.api.allow-unauthenticated=false
# How many reverse proxies sit in front of this container.
#
# Rate limits and the login throttle are keyed on the client address. Proxies
# APPEND to X-Forwarded-For, so the leftmost entry is supplied by the caller and
# the count is taken from the right: 1 trusts the entry your nearest proxy wrote,
# 2 goes one further out, and so on. 0 (the default) believes nothing in the
# header and uses the socket peer, which is safe everywhere but shares one bucket
# between everyone behind a proxy.
#
# Do not guess this. On the first forwarded request the application logs the
# chain it received and the address it selected; count the entries there.
# Env: OMNISSA_TRUSTED_PROXY_HOPS.
omnissa.security.trusted-proxy-hops=0
# Set true to disable local username/password login entirely (OAuth2-only mode).
# Env: OMNISSA_AUTH_LOCAL_LOGIN_DISABLED. Requires a working admin OAuth2 client.
omnissa.auth.local-login-disabled=false
# Rate limit on the inbound callout endpoint (POST /api/approvals/new):
# maximum requests per minute per client IP; 0 disables rate limiting.
# Env: OMNISSA_API_RATE_LIMIT.
omnissa.api.rate-limit=60

# ── Webhook notifications ─────────────────────────────────────────────────────
# POST a notification to a webhook whenever a new activation request arrives.
# Blank URL disables it. Format: generic (JSON event) | slack | teams.
# Env: WEBHOOK_URL / WEBHOOK_FORMAT.
webhook.url=
webhook.format=generic
# Also notify on JIT lifecycle events (#49): access revoked at expiry, and the
# app re-opened for request afterwards. false = audit trail + web UI only.
# Env: WEBHOOK_NOTIFY_LIFECYCLE.
webhook.notify-lifecycle=true

# Public base URL of this tool, e.g. https://approvals.example.com. Used to build
# deep links in Teams cards — notifications are sent from a background thread, so
# the public URL cannot be derived from forwarded headers. Env: APP_BASE_URL.
app.base-url=

# ── Actionable Teams approvals (#55) ─────────────────────────────────────────
# When true AND webhook.format=teams AND app.base-url is set, the new-request
# notification is an Adaptive Card with Approve/Reject buttons that open the
# request in this tool (Office 365 connectors are retired and a Power Automate
# callback needs the premium HTTP connector, so the buttons are deep links —
# the approver authenticates with this tool's own login). Env: TEAMS_ACTIONABLE.
teams.actionable=false

# ── Actionable Slack approvals (#50) ──────────────────────────────────────────
# When true AND webhook.format=slack, the new-request notification carries
# Approve / Reject / Open buttons that open the request in this tool with the
# decision pre-selected. Requires app.base-url. Env: SLACK_ACTIONABLE.
#
# The buttons are deep links rather than interactive callbacks, so approvers
# sign in and the ordinary role rules apply. There is no inbound endpoint, no
# signing secret and no separate approver list to keep in step with Omnissa
# Access group membership.
slack.actionable=false

# ── Local password policy (#62) ───────────────────────────────────────────────
# Applies to local accounts only; Omnissa Access users authenticate there.
# Configuration can TIGHTEN this policy but not remove it — min-length is
# clamped to a floor of 8 and a warning is logged if a lower value is set.
omnissa.password.min-length=${OMNISSA_PASSWORD_MIN_LENGTH:12}
omnissa.password.min-distinct=${OMNISSA_PASSWORD_MIN_DISTINCT:5}
omnissa.password.block-username=${OMNISSA_PASSWORD_BLOCK_USERNAME:true}
# Extra weak-password wordlist, one per line, merged with the bundled list.
# Worth setting mainly if you LOWER min-length: at 12 characters a general
# common-password corpus adds almost nothing (only 10 of the 10,000 most common
# passwords are that long), but at 8 it matters a great deal.
omnissa.password.blocklist-file=${OMNISSA_PASSWORD_BLOCKLIST_FILE:}
# Composition rules — OFF by default and not recommended. They push people
# towards Password1! while adding little entropy and rejecting strong
# passphrases (NIST SP 800-63B). Provided for compliance requirements.
omnissa.password.require-mixed-case=${OMNISSA_PASSWORD_REQUIRE_MIXED_CASE:false}
omnissa.password.require-digit=${OMNISSA_PASSWORD_REQUIRE_DIGIT:false}
omnissa.password.require-symbol=${OMNISSA_PASSWORD_REQUIRE_SYMBOL:false}

# ── Log export ────────────────────────────────────────────────────────────────
# Forward application logs to a syslog server. Blank host disables it.
# syslog.port is a port NUMBER only (e.g. 514); the transport is selected by
# syslog.protocol: udp (default) | tcp | tls. Values are case-insensitive;
# an unknown value logs a warning and falls back to udp.
# Env: SYSLOG_HOST / SYSLOG_PORT / SYSLOG_PROTOCOL.
syslog.host=
syslog.port=514
syslog.protocol=udp

# TLS options — used only when syslog.protocol=tls.
# Server trust: platform default trust store, unless a CA bundle is provided
# below (use it for private or self-signed syslog server certificates).
# Client certificate auth (mutual TLS): set BOTH the client cert and key. The
# key must be unencrypted PKCS#8 ("BEGIN PRIVATE KEY"); convert legacy
# PKCS#1/SEC1 keys with `openssl pkcs8 -topk8 -nocrypt`.
# Each item accepts inline PEM text or a file path; the *-file variant takes
# precedence when both are set. File paths are container paths — keep the
# files under /app/data/certs/ (the persistent volume in Docker deployments).
# Env: SYSLOG_CLIENT_CERT_PEM / SYSLOG_CLIENT_KEY_PEM / SYSLOG_CA_PEM /
#      SYSLOG_CLIENT_CERT_FILE / SYSLOG_CLIENT_KEY_FILE / SYSLOG_CA_FILE.
syslog.client-cert-pem=
syslog.client-key-pem=
syslog.ca-pem=
syslog.client-cert-file=
syslog.client-key-file=
syslog.ca-file=

# ── Mail (optional — uncomment one option) ───────────────────────────────────
# No spring.mail.host means no relay, and that is a supported state: Spring
# Boot auto-configures a JavaMailSender only when a host is set, so requiring
# one made an install with no SMTP server fail to start with "Field mailSender
# ... required a bean of type 'JavaMailSender' that could not be found".
# Decisions now go through unchanged and MailNotification logs, per decision,
# that the requester was not e-mailed and which property would fix it —
# announced rather than swallowed, so nobody assumes a notification was sent.
#
# Keep an unreachable/unset SMTP server from flipping /actuator/health to DOWN
# (which fails the Docker healthcheck).
management.health.mail.enabled=false

# Bound every SMTP operation. Jakarta Mail defaults all three of these to
# INFINITE, and MailNotification sends synchronously — so a relay that silently
# drops packets rather than refusing the connection (a firewalled port 25, which
# is the common case rather than an exotic one) parks the calling thread with no
# recovery short of a restart. A refused connection fails fast and is harmless;
# a blackholed one is what hangs.
#
# Today that thread belongs to the request that made a decision, so the damage
# is one stuck response. A future caller on the scheduler would be far worse:
# all @Scheduled jobs share a single thread, so a hung send would also stop JIT
# expiry, and time-bound access would silently never expire while every health
# check stayed green.
#
# Ten seconds is well beyond any healthy relay and well below the point where a
# parked thread starts to matter.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Sender address for requester notifications — must be permitted by the relay
# (Office 365 requires an accepted-domain address matching the account).
# Env: SPRING_MAIL_FROM.
spring.mail.from=no-reply@example.com

# Gmail SMTP (use an App Password if 2FA is enabled):
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=your_account@gmail.com
#spring.mail.password=your_app_password
#spring.mail.properties.mail.smtp.starttls.enable=true

# Standard SMTP on port 25:
#spring.mail.host=mysmtp.company.com

#spring.mail.properties.mail.debug=true

# ── SSL / TLS (standalone mode — not used with Caddy) ────────────────────────
# Place keystore.p12 in the config/ directory (gitignored).
# Generate via:  scripts/gen-dev-cert.sh      (self-signed, dev only)
#                scripts/import-cert.sh        (from PEM cert + key)
#
# Uncomment and set SSL_KEYSTORE_PASSWORD to enable:
#server.port=8443
#server.http.port=8080
#server.ssl.key-store=file:./config/keystore.p12
#server.ssl.key-store-type=PKCS12
#server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:changeit}
#server.ssl.key-alias=omnissa-approval
#server.ssl.enabled=true
# TLS 1.2 minimum — disables deprecated TLS 1.0 / 1.1
#server.ssl.protocol=TLS
#server.ssl.enabled-protocols=TLSv1.2,TLSv1.3

# ── Health probe (used by Docker healthcheck) ─────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ── Admin OAuth2 Login (Omnissa Access as OIDC IdP) ─────────────────────────
# Optional. Leave omnissa.admin-oauth.client-id blank — the shipped default —
# and the tool never registers an OAuth2 client at all: /oauth2/** is not in
# the filter chain, the login page offers only the local username/password
# form, and nothing contacts a tenant at startup.
#
# There are deliberately no spring.security.oauth2.client.registration.*
# lines here. There used to be, each defaulting to blank, on the theory that a
# blank client id would switch OAuth2 off. It does not: a placeholder with an
# empty default still DEFINES the key, so Spring Boot bound a registration with
# an empty client id and refused to start —
#   "Client id of registration 'omnissa' must not be empty"
# — which, since blank is the default, meant a fresh install could not boot.
# The keys have to be absent, not empty, and only code that runs before the
# context exists can withhold them: see AdminOAuthEnvironmentPostProcessor,
# which contributes exactly the same properties this block used to, and only
# when a client id is present. It adds them at the lowest precedence, so
# anything you set explicitly — here, in application-local.properties or in
# the environment — still wins.
#
# Set via environment variables or application-local.properties:
#   OMNISSA_ADMIN_OAUTH_CLIENT_ID       (blank = OAuth2 login off)
#   OMNISSA_ADMIN_OAUTH_CLIENT_SECRET
#   OMNISSA_ADMIN_OAUTH_REDIRECT_URI    (default http://localhost:8081/login/oauth2/code/omnissa)
#   OMNISSA_ADMIN_OAUTH_ISSUER_URI      (see Option A below)
#   OMNISSA_ADMIN_OAUTH_SCOPE           (default openid,email,profile,group)
#
# The "group" scope makes Omnissa Access emit the group_names / group_ids
# claims, which is what role mapping keys off. A tenant advertises it in
# scopes_supported at <issuer>/.well-known/openid-configuration; if yours does
# not, override with OMNISSA_ADMIN_OAUTH_SCOPE (e.g. openid,email,profile).
# Sign in and open /api/auth/claims to see exactly what your tenant returns.
#
# Required Omnissa Access client config:
#   Type: User Access Token (Confidential)
#   Grant: Authorization Code
#   PKCE: enabled
#   Scopes: openid email profile group
#   Redirect URI: https://<your-host>/login/oauth2/code/omnissa

# ---- Role-based access control (#52) ---------------------------------------
# Maps Omnissa Access group membership to application roles, as comma-separated
# <groupId>:<ROLE> pairs. Roles: ADMIN, APPROVER, VIEWER, AUDITOR.
#
# Matched against the OIDC group_ids claim rather than group names: renaming a
# group in Access would otherwise silently drop everyone to VIEWER with no
# error. Sign in and open /api/auth/claims to read the ids — it pairs each id
# with its display name.
#
# Anyone who signs in gets VIEWER; matched groups add roles on top, and a user
# in several mapped groups gets all of them. Leaving this blank means every
# OIDC user is a VIEWER, so enabling the map is the explicit act that grants
# privilege.
#
#   OMNISSA_ROLE_MAP=<admins-uuid>:ADMIN,<approvers-uuid>:APPROVER,<auditors-uuid>:AUDITOR
omnissa.rbac.role-map=${OMNISSA_ROLE_MAP:}

# Option A (preferred): OIDC auto-discovery — Spring fetches
#   <issuer-uri>/.well-known/openid-configuration at startup.
# Set omnissa.admin-oauth.issuer-uri (or OMNISSA_ADMIN_OAUTH_ISSUER_URI env var) to enable.
# Use https://<tenant>/SAAS/auth — the issuer advertised by the tenant's
# /.well-known/openid-configuration, NOT /acs. Left blank, no provider is
# contributed and discovery never runs.
#
# Option B (manual fallback): leave issuer-uri blank and uncomment these if the
#   discovery document is unavailable or wrong for your tenant. They are read
#   as-is; Option A is skipped whenever issuer-uri is blank, so the two do not
#   fight.
#
# A client id set with NEITHER an issuer nor these endpoints is a half
# configuration. It used to abort startup with "issuer cannot be empty", which
# named neither the property nor the tool; the app now starts, logs an error
# saying which of the two to set, and serves local sign-in in the meantime.
#spring.security.oauth2.client.provider.omnissa.authorization-uri=https://${omnissa.bootstrap.url}/SAAS/auth/oauth2/authorize
#spring.security.oauth2.client.provider.omnissa.token-uri=https://${omnissa.bootstrap.url}/SAAS/auth/oauthtoken
#spring.security.oauth2.client.provider.omnissa.user-info-uri=https://${omnissa.bootstrap.url}/SAAS/jersey/manager/api/userinfo
#spring.security.oauth2.client.provider.omnissa.jwk-set-uri=https://${omnissa.bootstrap.url}/SAAS/API/1.0/REST/auth/token
#spring.security.oauth2.client.provider.omnissa.user-name-attribute=sub

