# Mode 1 (RECOMMENDED) — Caddy handles TLS automatically via Let's Encrypt.
# Requires a public DNS record pointing to this host.
#
# Usage:
#   APPROVAL_DOMAIN=approval.yourdomain.com docker compose up -d
#
# Or copy .env.example → .env and fill in values, then: docker compose up -d

services:

  app:
    build: .
    expose:
      - "8081"
    environment:
      SERVER_PORT: 8081
      # Caddy is the only way in and it serves HTTPS only, so the session
      # cookie can carry the Secure flag (the app itself sees plain HTTP).
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "true"
      OMNISSA_BOOTSTRAP_URL:            ${OMNISSA_BOOTSTRAP_URL}
      OMNISSA_BOOTSTRAP_CLIENT_ID:      ${OMNISSA_BOOTSTRAP_CLIENT_ID}
      OMNISSA_BOOTSTRAP_CLIENT_SECRET:  ${OMNISSA_BOOTSTRAP_CLIENT_SECRET}
      OMNISSA_BOOTSTRAP_ADMIN_USERNAME: ${OMNISSA_BOOTSTRAP_ADMIN_USERNAME:-}
      OMNISSA_BOOTSTRAP_ADMIN_PASSWORD: ${OMNISSA_BOOTSTRAP_ADMIN_PASSWORD:-}
      OMNISSA_BOOTSTRAP_ADMIN_EMAIL:    ${OMNISSA_BOOTSTRAP_ADMIN_EMAIL:-}
      OMNISSA_ADMIN_OAUTH_CLIENT_ID:    ${OMNISSA_ADMIN_OAUTH_CLIENT_ID:-}
      OMNISSA_ADMIN_OAUTH_CLIENT_SECRET: ${OMNISSA_ADMIN_OAUTH_CLIENT_SECRET:-}
      OMNISSA_ADMIN_OAUTH_REDIRECT_URI: ${OMNISSA_ADMIN_OAUTH_REDIRECT_URI:-https://approvals.example.com/login/oauth2/code/omnissa}
      OMNISSA_ADMIN_OAUTH_ISSUER_URI:        ${OMNISSA_ADMIN_OAUTH_ISSUER_URI:-}
      OMNISSA_ADMIN_OAUTH_DISABLE_CONSENT:   ${OMNISSA_ADMIN_OAUTH_DISABLE_CONSENT:-false}
      SPRING_MAIL_HOST:                 ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT:                 ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME:             ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD:             ${SPRING_MAIL_PASSWORD:-}
    volumes:
      - app_data:/app/data
      # Approved updates are written here for the host-side updater (#83).
      # A separate volume from app_data, which backup archives — a restored
      # archive must never carry a pending deploy.
      - app_control:/app/control
    restart: unless-stopped
    # Margin only. Since 1.23.5 the app closes its live-update streams the moment
    # shutdown begins, so a stop finishes in about a second even with Dashboard
    # tabs open; the default 10 s would do, 15 s leaves room for a slow host.
    stop_grace_period: 15s
    # Defence in depth for a process that needs neither: no capability, and no
    # way to gain one.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      APPROVAL_DOMAIN: ${APPROVAL_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # stores the Let's Encrypt cert
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  app_data:
  caddy_data:
  caddy_config:
  app_control:
