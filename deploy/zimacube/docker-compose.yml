# ZimaCube deployment — used by deploy.sh, safe for CasaOS adoption.
#
# Pulls the published image from GHCR (no local build) instead of using a
# build: context — if CasaOS adopts the app it copies this compose to
# /var/lib/casaos/apps/ and recreates the container, which would break a
# relative build path. ALL state is bind-mounted to /media/ZIMARAID so a
# CasaOS-triggered recreate wipes nothing.
#
# IMAGE TAG / UPDATES — the CasaOS "Check and then update" button does NOT
# work for this container and no tag choice changes that: ZimaOS decides
# whether an update exists by looking the app up in a CasaOS AppStore, and an
# externally-managed Compose app is never found there, so it always reports
# "latest version" without ever contacting the registry. Update with deploy.sh,
# `docker compose pull` + `up -d`, or the opt-in watchtower profile below.
# CI publishes a moving major.minor tag (e.g. 1.9) plus the immutable full
# version (1.9.4); set OMNISSA_IMAGE_TAG in this compose's .env to pin a minor
# line for deterministic deploys. Default stays :latest.

name: omnissa-approvals

services:
  omnissa-approvals:
    # Pin OMNISSA_IMAGE_TAG to the minor line (e.g. 1.4) for CasaOS-detectable
    # updates; defaults to :latest so existing deployments are unaffected.
    image: ghcr.io/squidlyman/omnissa-access-approvals:${OMNISSA_IMAGE_TAG:-latest}
    container_name: omnissa-approvals
    restart: unless-stopped
    labels:
      # Opt-in marker for the (disabled-by-default) watchtower service below.
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      # Bound to the LAN IP; note CasaOS adoption resets this to 0.0.0.0 —
      # the DOCKER-USER iptables rule (omnissa-approvals-fw.service) is what
      # actually keeps the port LAN-only.
      - "${LAN_IP:-0.0.0.0}:8081:8081"
      # Loopback publish, REQUIRED on ZimaOS/CasaOS. Before opening an app
      # CasaOS probes it at http://127.0.0.1:<port_map>/ ("checking compose app
      # health at the specified web port", ComposeApp.HealthCheck). With the
      # port bound only to the LAN IP that probe is refused, CasaOS concludes
      # the app is down, and clicking its tile silently runs a pull + recreate
      # instead of opening the UI. Loopback is host-only, so this does not
      # widen network exposure.
      - "127.0.0.1:8081:8081"
    env_file:
      - /media/ZIMARAID/omnissa-approvals/omnissa-approvals.env
    environment:
      SERVER_PORT: 8081
    volumes:
      # H2 database — the only state the app writes (Spring workdir /app/data)
      - /media/ZIMARAID/omnissa-approvals/data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional auto-updater — DISABLED BY DEFAULT. This service only runs when
  # the "autoupdate" compose profile is explicitly enabled:
  #   docker compose -f <this file> --profile autoupdate up -d
  # When enabled, Watchtower checks GHCR daily and pulls + recreates the
  # approvals container whenever a new image is published. It only manages
  # containers carrying the com.centurylinklabs.watchtower.enable label
  # (WATCHTOWER_LABEL_ENABLE) — nothing else on the host is touched. It
  # requires access to the Docker socket; that is the standard Watchtower
  # deployment model, but it grants the container control over Docker —
  # which is exactly why this ships disabled.
  watchtower:
    image: containrrr/watchtower:latest
    container_name: omnissa-approvals-watchtower
    restart: unless-stopped
    profiles: ["autoupdate"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"   # only touch labeled containers
      WATCHTOWER_CLEANUP: "true"        # remove superseded images
      WATCHTOWER_POLL_INTERVAL: "86400" # daily; override via env if desired

x-casaos:
  architectures: [amd64]
  main: omnissa-approvals
  author: SquidlyMan
  category: Utilities
  title:
    en_us: Access Approval Tool for Omnissa
  description:
    en_us: Independent approval workflow tool for Omnissa Access (Workspace ONE) application requests. Not an Omnissa product.
  icon: "data:image/svg+xml;base64,"
  # port_map is what CasaOS probes on 127.0.0.1 before opening the app (see the
  # loopback publish above) and the port it puts in the tile's link.
  port_map: "8081"
  index: /
  # Point the CasaOS tile at the public URL instead of http://<nas>:8081. This
  # matters because admin OAuth2 login only works on the registered redirect
  # URI — reaching the app by NAS host:port breaks "Sign in with Omnissa
  # Access" (local admin login still works). Set WEBUI_SCHEME=https and
  # WEBUI_HOSTNAME=approvals.example.com in this compose's .env. Left empty,
  # CasaOS falls back to the NAS host and port_map, which is the old behavior.
  scheme: ${WEBUI_SCHEME:-http}
  hostname: ${WEBUI_HOSTNAME:-}
