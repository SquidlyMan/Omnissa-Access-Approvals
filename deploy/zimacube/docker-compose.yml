# ZimaCube deployment — used by deploy.sh, safe for CasaOS adoption.
#
# Pulls the published image from GHCR (no local build) instead of using a
# build: context — if CasaOS adopts the app it copies this compose to
# /var/lib/casaos/apps/ and recreates the container, which would break a
# relative build path. ALL state is bind-mounted to /media/ZIMARAID so a
# CasaOS-triggered recreate wipes nothing.
#
# IMAGE TAG / UPDATES — the CasaOS "Check and then update" button does NOT
# work for this container and no tag choice changes that: ZimaOS decides
# whether an update exists by looking the app up in a CasaOS AppStore, and an
# externally-managed Compose app is never found there, so it always reports
# "latest version" without ever contacting the registry. Update by approving a
# version in the console (the host-side updater applies it), or with
# `deploy.sh <version>`.
# Pin OMNISSA_IMAGE_TAG in this compose's .env to the IMMUTABLE full version
# (1.22.0), never the moving minor line (1.22): a moving pin lets any pull —
# a CasaOS tile click, a settings save — upgrade with nobody approving it.

name: omnissa-approvals

services:
  omnissa-approvals:
    image: ghcr.io/squidlyman/omnissa-access-approvals:${OMNISSA_IMAGE_TAG:-latest}
    container_name: omnissa-approvals
    restart: unless-stopped
    ports:
      # Bound to the LAN IP; note CasaOS adoption resets this to 0.0.0.0 —
      # the DOCKER-USER iptables rule (omnissa-approvals-fw.service) is what
      # actually keeps the port LAN-only.
      - "${LAN_IP:-0.0.0.0}:8081:8081"
      # Loopback publish, REQUIRED on ZimaOS/CasaOS with the default x-casaos
      # settings below. Before opening an app CasaOS probes it at
      # <scheme>://<hostname>:<port_map>/ ("checking compose app health at the
      # specified web port", ComposeApp.HealthCheck) — and with x-casaos
      # hostname unset that resolves to http://127.0.0.1:<port_map>/. Bound
      # only to the LAN IP, that probe is refused, CasaOS concludes the app is
      # down, and clicking its tile silently runs a pull + recreate instead of
      # opening the UI. Loopback is host-only, so this does not widen network
      # exposure.
      - "127.0.0.1:8081:8081"
    env_file:
      - /media/ZIMARAID/omnissa-approvals/omnissa-approvals.env
    environment:
      SERVER_PORT: 8081
    volumes:
      # H2 database — the only state the app writes (Spring workdir /app/data)
      - /media/ZIMARAID/omnissa-approvals/data:/app/data
        # Approved updates are written here for the host-side updater (#83).
        # A separate mount from data/, which backup archives — a restored
        # archive must never carry a pending deploy.
      - /media/ZIMARAID/omnissa-approvals/control:/app/control
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3

x-casaos:
  architectures: [amd64]
  main: omnissa-approvals
  author: SquidlyMan
  category: Utilities
  title:
    en_us: Access Approval Tool for Omnissa
  description:
    en_us: Independent approval workflow tool for Omnissa Access (Workspace ONE) application requests. Not an Omnissa product.
  icon: "data:image/svg+xml;base64,"
  index: /
  # CasaOS builds the tile's link as scheme://hostname:port_map/index — the
  # port is ALWAYS appended, so these three must be set as a set.
  #
  # Default (all unset): http://<nas-host>:8081/ — the app's own port.
  #
  # Behind a TLS reverse proxy, point the tile at the public URL instead, in
  # this compose's .env:
  #     WEBUI_SCHEME=https
  #     WEBUI_HOSTNAME=approvals.example.com
  #     WEBUI_PORT=443
  # which yields https://approvals.example.com:443/ — i.e. the public URL.
  # Worth doing: admin OAuth2 login only works on the registered redirect URI,
  # so opening the app by NAS host:port breaks "Sign in with Omnissa Access"
  # (local admin login still works), and a plain-http link is blocked as mixed
  # content when the ZimaOS dashboard itself is served over https.
  port_map: "${WEBUI_PORT:-8081}"
  scheme: ${WEBUI_SCHEME:-http}
  hostname: ${WEBUI_HOSTNAME:-}
