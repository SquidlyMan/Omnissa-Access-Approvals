name: Publish container

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/squidlyman/omnissa-access-approvals

# Two native builds — one per architecture, each on a runner of that
# architecture — merged into one multi-platform image at the end. The Maven
# build inside the Dockerfile is the expensive part, and running it under QEMU
# for arm64 takes tens of minutes and fails intermittently; GitHub's arm64
# runners make it the same five-minute build as amd64.
#
# The build jobs push by DIGEST only (no tags). The merge job creates the
# tags, so a tag can never point at one architecture while the other is still
# building, and the update checker's digest comparison — which reads the
# manifest INDEX digest the registry reports for a tag — sees one index that
# both architectures resolve through.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Prepare
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Version tags and :latest come ONLY from a v* git tag. A push to main
      # publishes the commit sha, nothing else.
      #
      # It used to publish the pom version on every main push too, on the
      # theory that CasaOS's "Check and update" would notice a moved version
      # tag. It never did — that button never contacts the registry for an
      # externally-managed app — and the side effect was worse than useless:
      # every merge moved an "immutable" tag like 1.21.1 onto different
      # content, so pinning to it pinned nothing. The console's own update
      # detection and the host-side updater now rely on N.N.N tags being
      # exactly what they say, once, forever. No moving major.minor tag
      # either: the only reason to publish one is so that someone can pin to
      # it, and a moving pin is exactly what the updater exists to end.
      #
      # `latest` follows the same logic one step further: it moves only when a
      # release is tagged, so it always means "the newest release". A push to
      # main publishes the commit sha and nothing else — a first-time install
      # from the README's `:latest` must never land on an unreleased build.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=sha

      - name: Create the multi-platform manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect
        run: |
          for t in $(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON"); do
            docker buildx imagetools inspect "$t"
          done
