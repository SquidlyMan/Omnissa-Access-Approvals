name: Publish container

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Version tags come ONLY from a v* git tag. A push to main publishes
      # :latest and the commit sha, nothing else.
      #
      # It used to publish the pom version on every main push too, on the
      # theory that CasaOS's "Check and update" would notice a moved version
      # tag. It never did — that button never contacts the registry for an
      # externally-managed app — and the side effect was worse than useless:
      # every merge moved an "immutable" tag like 1.21.1 onto different
      # content, so pinning to it pinned nothing. The console's own update
      # detection and the host-side updater now rely on N.N.N tags being
      # exactly what they say, once, forever.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/squidlyman/omnissa-access-approvals
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
