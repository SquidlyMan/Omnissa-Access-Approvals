name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main, "claude/**"]

# The build only reads the repository; without this block the token gets the
# repository's default, which can be write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # The Maven build also runs the frontend build (npm install + vite build)
      # via frontend-maven-plugin.
      - name: Build and test
        run: ./mvnw -B verify
