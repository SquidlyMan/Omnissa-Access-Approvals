version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    # Minor and patch updates arrive as ONE grouped pull request; majors stay
    # individual so each can be judged on its own. The "ignore this major
    # version" conditions left by the 2026-07-03 comments (#4, #1, #10, #13),
    # which had kept Spring Boot 4.x, springdoc 3.x, Vite 8.x and Tailwind 4.x
    # updates from arriving, were cleared on 2026-10-21 by
    # `@dependabot unignore` comments on those same closed pull requests. The
    # 2026-10-30 maven and npm jobs ran with no ignore conditions.
    groups:
      maven-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/src/main/frontend"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Every action is pinned to a full commit hash with the exact version in a
    # trailing comment (`uses: actions/checkout@<sha> # v7.0.1`), since 1.24.0.
    # A tag can be moved to different code by whoever controls the action's
    # repository, or by whoever compromises it; a commit hash cannot. The publish
    # workflow holds a token that can push the image, so what runs there has to
    # be exactly what was reviewed.
    #
    # Until 1.24.0 the workflows floated on the major tag and this block ignored
    # minor and patch updates, because a floating tag picks them up by itself.
    # A pinned hash picks up nothing, so those updates now arrive here: ONE
    # grouped pull request for minors and patches, which rewrites the hash and
    # the version comment together. Majors stay individual, as elsewhere.
    #
    # Keep every action pinned the same way. #120 once re-pinned a single
    # action exactly while six floated, which was the worst of both.
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
